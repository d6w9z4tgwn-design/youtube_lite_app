name: Build and draft release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
        # Voice wheels can bundle GPL codecs. Keep public builds standard-only
        # until native-library licensing and corresponding-source review is done.
        voice: [false]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - if: matrix.voice
        run: python -m pip install -r requirements-voice.txt
      - run: python scripts/release.py audit --require-license
      - name: Verify tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from version import APP_VERSION; assert os.environ['RELEASE_TAG'] == 'v' + APP_VERSION, 'Tag/version mismatch'"
      - run: python -m unittest discover -s tests
      - if: matrix.voice
        run: python scripts/build.py --voice
      - if: ${{ !matrix.voice }}
        run: python scripts/build.py
      - if: matrix.voice
        run: python scripts/smoke_build.py --voice
      - if: ${{ !matrix.voice }}
        run: python scripts/smoke_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNest-${{ matrix.os }}-voice-${{ matrix.voice }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: ClipNest-*
          path: release
          merge-multiple: true
      - run: python scripts/release.py source
      - name: Create checksums and draft (does not publish)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python scripts/release.py checksums > release/SHA256SUMS.txt
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt --draft --verify-tag --title "ClipNest $RELEASE_TAG" --notes-file CHANGELOG.md
